name: Monthly projects summary

on:
  schedule:
    - cron: "0 3 1 * *" # 1st of every month, 08:30 IST
  workflow_dispatch: # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Update README
        run: node scripts/update-readme.js
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: iqbalshaid
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update monthly projects summary" && git push)
