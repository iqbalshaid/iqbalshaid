name: Monthly projects summary

on:
  schedule:
    - cron: "0 3 */2 * *" # every 2 days, 08:30 IST
  workflow_dispatch: # "Run workflow" button for manual runs
  push: # re-run when the script or descriptions change
    branches: [master]
    paths:
      - "scripts/**"
      - "descriptions.json"
      - "tools.json"
      - ".github/workflows/monthly-projects.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Anthropic SDK
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk
      - name: Update README
        run: node scripts/update-readme.js
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: iqbalshaid
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md writeups.json
          git diff --cached --quiet || (git commit -m "Update monthly projects summary" && git push)
